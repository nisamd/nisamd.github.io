baseURL = "https://nisamd.github.io/"
locale = "en"
title = "Nima Samadi"
enableRobotsTXT = true
capitalizeListTitles = false

[params]
  description = "Notes on machine learning, reinforcement learning, computer systems, and things learned along the way."
  author = "Nima Samadi"
  github = "https://github.com/nisamd"
  twitter = "https://x.com/NimaNotFound"
  email = "nbr.smd@gmail.com"
  goatcounter = "nisamd"  # visit stats at https://nisamd.goatcounter.com; counted only on the published site

  [params.social]
    twitter = "NimaNotFound"  # twitter:site in link previews

  # Comments stay off until repoId and categoryId are filled in (see README).
  [params.giscus]
    repo = "nisamd/nisamd.github.io"
    repoId = "R_kgDOVtFqzQ"
    category = "Announcements"
    categoryId = "DIC_kwDOVtFqzc4DLEEO"

[taxonomies]
  tag = "tags"      # blog posts
  topic = "topics"  # projects

[permalinks.taxonomy]
  topics = "/projects/topics/"
[permalinks.term]
  topics = "/projects/topics/:slug/"

[outputs]
  home = ["html"]
  section = ["html", "rss"]
  taxonomy = ["html"]
  term = ["html"]

[[menus.main]]
  name = "home"
  pageRef = "/"
  weight = 1
[[menus.main]]
  name = "blog"
  pageRef = "/blog"
  weight = 2
[[menus.main]]
  name = "projects"
  pageRef = "/projects"
  weight = 3
[[menus.main]]
  name = "about"
  pageRef = "/about"
  weight = 4

[markup]
  [markup.highlight]
    noClasses = false  # colors come from assets/css/syntax.css (scripts/syntax-css.sh)
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [["$$", "$$"], ["\\[", "\\]"]]
      inline = [["$", "$"], ["\\(", "\\)"]]
